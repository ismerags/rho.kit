# Run the test suite on every push and pull request.
#
# The tests need no network — every fixture is real markup captured from the
# live retailer sites and committed under tests/fixtures/. That is deliberate:
# a test suite that hits Amazon would fail for reasons that have nothing to do
# with the code.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README claims to support, and a current one.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_tracker.py

      - name: Check the site generator imports nothing third-party
        # The deploy workflow has no `pip install` step. If someone adds an
        # import of requests to site.py or one of its dependencies, deploys
        # start failing at a confusing distance from the change. Catch it here
        # instead, by building with third-party packages made unimportable.
        run: |
          python - <<'PY'
          import builtins, sys
          blocked = {"requests", "bs4", "lxml", "urllib3", "charset_normalizer"}
          real = builtins.__import__
          def guard(name, *a, **k):
              if name.split(".")[0] in blocked:
                  raise AssertionError(
                      f"legotracker.site must not import {name!r} — the deploy "
                      "workflow installs no dependencies")
              return real(name, *a, **k)
          builtins.__import__ = guard
          import legotracker.site  # noqa: F401
          print("OK: site generator is standard library only")
          PY
